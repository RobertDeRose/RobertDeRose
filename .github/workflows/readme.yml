name: Refresh README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - name: Render release cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases.py

      - name: Stamp today's date on the banner
        run: python3 scripts/banner.py .

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh banner date and release cards" || exit 0
          git push
